name: Go Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          check-latest: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

  docker:
    name: Build image with PostgreSQL 18 client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t go-dbdumper:test .

      - name: Check PostgreSQL client versions
        run: docker run --rm --entrypoint pg_dump go-dbdumper:test --version | grep -E '^pg_dump \(PostgreSQL\) 18\.'

      - name: Check psql version
        run: docker run --rm --entrypoint psql go-dbdumper:test --version | grep -E '^psql \(PostgreSQL\) 18\.'
